<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado ITIL V4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8f8f8;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .alternativa {
      background-color: #e0e0e0;
    }
    .alternativa:hover {
      background-color: #d0d0d0;
    }
    .correta {
      background-color: #a5f7a5 !important;
    }
    .errada {
      background-color: #f7a5a5 !important;
    }
    .selecionada {
      background-color: #d0e7ff !important;
    }
    #nextBtn {
      background-color: #007bff;
      color: white;
    }
    #nextBtn:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #submitBtn {
      background-color: green;
      color: white;
    }
    #prevBtn {
      background-color: red;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Simulado ITIL V4</h1>
  <form id="quizForm">
    <label for="name">Coloque seu Nome:</label>
    <input type="text" id="name" name="name" required>

    <div id="questionContainer"></div>

    <div id="navigation">
      <button type="button" id="prevBtn" onclick="restartQuiz()">Reiniciar</button>
      <button type="button" id="nextBtn" onclick="nextQuestion()">Próximo</button>
      <button type="submit" id="submitBtn" class="hidden">Concluir</button>
    </div>
  </form>

  <div id="results"></div>

  <script>
    const questions = [
      { 
        question: "Qual dos itens abaixo concede ao usuário acesso a um sistema?",
        options: ["Requisição de serviço", "Acordo de serviço", "Consumo de serviço", "Provisão de serviço"],
        answer: "Provisão de serviço"
      },
      { 
        question: "Qual princípio se concentra nos consumidores de serviço?",
        options: ["Começar de onde você está", "Otimizar e automatizar", "Manter de forma simples", "Foco no valor"],
        answer: "Foco no valor"
      },
      { 
        question: "Qual prática é responsável por gerenciar riscos de confidencialidade, integridade e disponibilidade?",
        options: ["Gerenciamento de eventos", "Gerenciamento de segurança da informação", "Controle de mudanças", "Melhoria contínua"],
        answer: "Gerenciamento de segurança da informação"
      }
    ];

    let currentQuestion = 0;
    const userAnswers = [];

    const questionContainer = document.getElementById('questionContainer');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const prevBtn = document.getElementById('prevBtn');
    const resultsContainer = document.getElementById('results');

    function renderQuestion() {
      const q = questions[currentQuestion];
      questionContainer.innerHTML = `
        <h2>Pergunta ${currentQuestion + 1} de ${questions.length}</h2>
        <p>${q.question}</p>
        <ul>
          ${q.options.map(option => `
            <li>
              <button 
                type="button" 
                class="alternativa" 
                onclick="selectOption(this, '${option.replace(/'/g, "\\'")}')">
                ${option}
              </button>
            </li>
          `).join('')}
        </ul>
      `;

      // Controle dos botões
      if (currentQuestion === questions.length - 1) {
        nextBtn.classList.add('hidden');
        submitBtn.classList.remove('hidden');
      } else {
        nextBtn.classList.remove('hidden');
        submitBtn.classList.add('hidden');
      }
    }

    function selectOption(button, option) {
      const q = questions[currentQuestion];
      userAnswers[currentQuestion] = option;

      const buttons = questionContainer.querySelectorAll('.alternativa');

      buttons.forEach(btn => {
        const btnText = btn.innerText;
        btn.disabled = true;

        if (btnText === q.answer) {
          btn.classList.add('correta');
        }

        if (btnText === option && btnText !== q.answer) {
          btn.classList.add('errada');
        }
      });
    }

    function nextQuestion() {
      if (userAnswers[currentQuestion]) {
        currentQuestion++;
        renderQuestion();
      } else {
        alert('Por favor, selecione uma resposta antes de prosseguir.');
      }
    }

    function restartQuiz() {
      currentQuestion = 0;
      userAnswers.length = 0;
      resultsContainer.innerHTML = '';
      renderQuestion();
    }

    document.getElementById('quizForm').addEventListener('submit', function(e) {
      e.preventDefault();
      showResults();
    });

    function showResults() {
      let correctCount = 0;
      let resultHTML = `<h2>Resultado de ${document.getElementById('name').value}:</h2><ul>`;

      questions.forEach((q, index) => {
        const userAnswer = userAnswers[index];
        const isCorrect = userAnswer === q.answer;
        if (isCorrect) correctCount++;

        resultHTML += `
          <li>
            <strong>${q.question}</strong><br>
            Sua resposta: <span style="color: ${isCorrect ? 'green' : 'red'}">${userAnswer || 'Não respondida'}</span><br>
            Resposta correta: ${q.answer}
          </li><br>
        `;
      });

      resultHTML += `</ul><h3>Acertos: ${correctCount} de ${questions.length}</h3>`;
      resultsContainer.innerHTML = resultHTML;
    }

    renderQuestion();
  </script>
</body>
</html>
