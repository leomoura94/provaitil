<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simulado ITIL V4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8f8f8;
      color: #333;
    }
    h1, h2 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .alternativa {
      background-color: #e0e0e0;
    }
    .alternativa:hover {
      background-color: #d0d0d0;
    }
    .correta {
      background-color: #a5f7a5 !important;
    }
    .errada {
      background-color: #f7a5a5 !important;
    }
    .selecionada {
      background-color: #d0e7ff !important;
    }
    .disabled {
      pointer-events: none;
      opacity: 0.6;
    }
    #nextBtn {
      background-color: #007bff;
      color: white;
    }
    #nextBtn:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    #finalBtns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    #finalBtns button {
      flex: 1;
    }
  </style>
</head>
<body>
  <h1>Simulado ITIL V4</h1>
  <div id="app">Carregando perguntas...</div>

  <script>
    const perguntas = [
      {
        "pergunta": "Qual é o propósito do Gerenciamento de Incidentes?",
        "alternativas": [
          "Restaurar a operação normal do serviço o mais rápido possível",
          "Remover problemas conhecidos do ambiente",
          "Identificar causas raiz de incidentes",
          "Implementar mudanças com sucesso"
        ],
        "correta": 0
      },
      {
        "pergunta": "Qual valor é mais associado ao ITIL?",
        "alternativas": [
          "Foco em lucro",
          "Foco no cliente",
          "Foco em tecnologia",
          "Foco em processos"
        ],
        "correta": 1
      },
      {
        "pergunta": "Qual das opções abaixo é uma prática da ITIL 4?",
        "alternativas": [
          "Gestão de Qualidade",
          "Gestão de Mudança",
          "Gestão de Vendas",
          "Gestão de Produção"
        ],
        "correta": 1
      },
      {
        "pergunta": "O que é um incidente segundo a ITIL?",
        "alternativas": [
          "Uma causa raiz de um problema",
          "Uma solicitação de serviço",
          "Uma interrupção ou redução não planejada da qualidade de um serviço",
          "Uma alteração no ambiente de produção"
        ],
        "correta": 2
      }
    ];

    let indice = 0;
    let pontuacao = 0;
    let selecionada = null;

    perguntas.sort(() => Math.random() - 0.5); // Embaralhar

    function mostrarPergunta() {
      const p = perguntas[indice];
      const app = document.getElementById('app');
      selecionada = null;

      app.innerHTML = `
        <h2>${indice + 1}/${perguntas.length}</h2>
        <p><strong>${p.pergunta}</strong></p>
        <ul id="alternativas">
          ${p.alternativas.map((alt, i) => `
            <li><button onclick="selecionar(${i})" class="alternativa">${alt}</button></li>
          `).join('')}
        </ul>
        <button id="nextBtn" onclick="proxima()" disabled>Próxima</button>
      `;
    }

    function selecionar(i) {
      const correta = perguntas[indice].correta;
      const botoes = document.querySelectorAll('.alternativa');

      botoes.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correta) {
          btn.classList.add('correta');
        }
        if (idx === i && i !== correta) {
          btn.classList.add('errada');
        }
      });

      if (i === correta) pontuacao++;
      document.getElementById('nextBtn').disabled = false;
    }

    function proxima() {
      indice++;
      if (indice < perguntas.length) {
        mostrarPergunta();
      } else {
        mostrarResultado();
      }
    }

    function mostrarResultado() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <h2>Simulado finalizado!</h2>
        <p>Você acertou <strong>${pontuacao}</strong> de <strong>${perguntas.length}</strong> perguntas.</p>
        <div id="finalBtns">
          <button onclick="reiniciar()">Reiniciar</button>
          <button onclick="alert('Simulado concluído!')">Concluir</button>
        </div>
      `;
    }

    function reiniciar() {
      indice = 0;
      pontuacao = 0;
      perguntas.sort(() => Math.random() - 0.5);
      mostrarPergunta();
    }

    mostrarPergunta();
  </script>
</body>
</html>
